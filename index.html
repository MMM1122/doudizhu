<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗地主 · 单机版</title>
<style>
  :root{
    --felt-dark:#0b3d24;
    --felt-light:#0f5230;
    --gold:#d4af37;
    --gold-dim:#a9872c;
    --cream:#f6efe1;
    --red:#c0392b;
    --ink:#1c1c1c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(ellipse at center, var(--felt-light) 0%, var(--felt-dark) 75%);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--cream);
    user-select:none;
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100vw;height:100vh;
    display:flex;flex-direction:column;
    padding:10px 14px 16px;
  }
  header{
    text-align:center;
    padding:4px 0 10px;
    flex:0 0 auto;
  }
  header h1{
    font-family:"STKaiti","KaiTi",serif;
    font-weight:700;
    letter-spacing:6px;
    margin:0;
    font-size:26px;
    color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  #board{
    flex:1 1 auto;
    display:grid;
    grid-template-rows:auto 1fr auto;
    gap:8px;
    min-height:0;
  }
  .ai-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:0 6px;
  }
  .seat{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    min-width:120px;
  }
  .seat-label{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(212,175,55,.25);
    border-radius:16px;
    padding:8px 14px 9px;
    font-size:13px;
    transition:border-color .2s, box-shadow .2s;
  }
  .seat-label.active{
    border-color:var(--gold);
    box-shadow:0 0 12px rgba(212,175,55,.6);
  }
  .avatar{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    border:2px solid rgba(255,255,255,.25);
    position:relative;
    transition:border-color .2s, box-shadow .2s;
  }
  .avatar.seat-0{ background:linear-gradient(160deg,#3a5f8a,#1c3550); }
  .avatar.seat-1{ background:linear-gradient(160deg,#7a4a8a,#3a2050); }
  .avatar.seat-2{ background:linear-gradient(160deg,#8a5a2a,#4a2e10); }
  .avatar.is-landlord{ border-color:var(--gold); box-shadow:0 0 10px rgba(212,175,55,.75); }
  .avatar.is-farmer{ border-color:#6fbf73; }
  .crown-badge{
    position:absolute;top:-9px;right:-7px;
    font-size:17px;
    display:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  .avatar.is-landlord .crown-badge{ display:block; }
  .name-line{ font-weight:600; }
  .role-tag{
    font-size:11px;
    padding:1px 9px;
    border-radius:10px;
    background:rgba(255,255,255,.1);
    min-height:15px;
    line-height:15px;
  }
  .role-tag.landlord-tag{ background:var(--gold); color:#3a2a05; font-weight:700; }
  .role-tag.farmer-tag{ background:#4a8f52; color:#eafaea; font-weight:600; }
  #score-badge{
    display:none;
    margin-top:2px;
    font-size:12px;
    color:var(--gold);
    letter-spacing:2px;
  }
  .ai-hand{
    display:flex;
  }
  .back-card{
    width:32px;height:46px;
    background:repeating-linear-gradient(135deg,#7a1f1f,#7a1f1f 4px,#8f2a2a 4px,#8f2a2a 8px);
    border:1.5px solid var(--cream);
    border-radius:4px;
    margin-left:-20px;
    box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .ai-hand .back-card:first-child{margin-left:0;}
  .ai-last{
    min-height:56px;
    display:flex;gap:4px;
    margin-top:2px;
  }
  #center{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:0;
  }
  #info-board{
    text-align:center;
    font-size:15px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(212,175,55,.35);
    padding:8px 20px;
    border-radius:20px;
    max-width:520px;
  }
  #desk{
    display:flex;
    gap:6px;
    min-height:96px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
  }
  #bid-panel, #control-panel{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    padding:9px 22px;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:linear-gradient(180deg,#e8cd6e,var(--gold-dim));
    color:#3a2a05;
    box-shadow:0 3px 6px rgba(0,0,0,.35);
    transition:transform .12s, filter .12s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.95);}
  .btn.secondary{
    background:linear-gradient(180deg,#6b6b6b,#3f3f3f);
    color:var(--cream);
  }
  .btn:disabled{
    opacity:.4;cursor:not-allowed;
  }
  #player-zone{
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  #player-cards{
    display:flex;
    min-height:118px;
    align-items:flex-end;
    justify-content:center;
    flex-wrap:wrap;
    max-width:100%;
  }
  .card{
    width:56px;height:80px;
    background:var(--cream);
    color:var(--ink);
    border-radius:6px;
    box-shadow:0 3px 5px rgba(0,0,0,.35);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:4px 5px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    transition:transform .15s;
    position:relative;
    margin-left:-30px;
    flex:0 0 auto;
  }
  .card:first-child{margin-left:0;}
  .card.selected{transform:translateY(-16px);box-shadow:0 0 0 2px var(--gold), 0 6px 10px rgba(0,0,0,.5);}
  .card.red{color:var(--red);}
  .card .top{align-self:flex-start;line-height:1;}
  .card .suit{align-self:center;font-size:18px;}
  .card.joker-card{
    background:linear-gradient(160deg,#f6efe1,#e2d3ab);
  }
  .desk-card{
    width:50px;height:72px;
    background:var(--cream);
    color:var(--ink);
    border-radius:5px;
    box-shadow:0 2px 4px rgba(0,0,0,.35);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:3px 4px;
    font-weight:700;
    font-size:12px;
  }
  .desk-card.red{color:var(--red);}
  .small-desk{
    width:26px;height:38px;
    font-size:9px;
    border-radius:4px;
    padding:2px 3px;
  }
  #landlord-cards{
    display:flex;gap:4px;margin-top:2px;
  }
</style>
</head>
<body>
<div id="app">
  <header><h1>斗 地 主</h1><div id="score-badge"></div></header>
  <div id="board">
    <div class="ai-row">
      <div class="seat">
        <div class="seat-label" id="label-1">
          <div class="avatar seat-1" id="avatar-1">🙂<span class="crown-badge">👑</span></div>
          <span class="name-line" id="name-1">左家 AI</span>
          <span class="role-tag" id="role-1"></span>
        </div>
        <div class="ai-hand" id="hand-1"></div>
        <div class="ai-last" id="last-1"></div>
      </div>
      <div class="seat">
        <div class="seat-label" id="label-2">
          <div class="avatar seat-2" id="avatar-2">🙂<span class="crown-badge">👑</span></div>
          <span class="name-line" id="name-2">右家 AI</span>
          <span class="role-tag" id="role-2"></span>
        </div>
        <div class="ai-hand" id="hand-2"></div>
        <div class="ai-last" id="last-2"></div>
      </div>
    </div>

    <div id="center">
      <div id="info-board">正在洗牌发牌…</div>
      <div id="landlord-cards"></div>
      <div id="desk"></div>
      <div id="bid-panel" style="display:none;"></div>
    </div>

    <div id="player-zone">
      <div class="seat-label" id="label-0">
        <div class="avatar seat-0" id="avatar-0">🙂<span class="crown-badge">👑</span></div>
        <span class="name-line" id="name-0">你</span>
        <span class="role-tag" id="role-0"></span>
      </div>
      <div id="player-cards"></div>
      <div id="control-panel">
        <button class="btn" id="btn-play" onclick="humanPlay()">出牌</button>
        <button class="btn secondary" id="btn-pass" onclick="humanPass()">不要</button>
        <button class="btn secondary" onclick="restartGame()">重新开始</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ 基础数据 ============ */
const RANK_NAME = {3:'3',4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A',15:'2',16:'小王',17:'大王'};
const SUITS = [{s:'♠',red:false},{s:'♥',red:true},{s:'♦',red:true},{s:'♣',red:false}];

let players = [
  {name:'你', hand:[], isHuman:true},
  {name:'左家 AI', hand:[], isHuman:false},
  {name:'右家 AI', hand:[], isHuman:false},
];
let landlordCards = [];
let landlordIndex = -1;
let landlordScore = 0;      // 最终叫分倍数（1~3）
let currentPlayer = -1;
let lastPlay = null;       // {type, main, len, cards}
let lastPlayer = -1;
let phase = 'bidding';     // bidding | playing | over
let biddingOrder = [];     // 本轮叫分的座位顺序（3人循环）
let bidStep = 0;           // 当前是第几次询问（对 3 取余得到座位）
let maxBid = 0;            // 当前最高叫分
let maxBidder = -1;        // 当前最高叫分者
let passStreak = 0;        // 连续不叫的次数

/* ============ 建牌 / 洗牌 / 发牌 ============ */
function createDeck(){
  const deck = [];
  for(let v=3; v<=15; v++){
    for(let i=0;i<4;i++){
      deck.push({val:v, name:RANK_NAME[v], suit:SUITS[i].s, red:SUITS[i].red});
    }
  }
  deck.push({val:16, name:'小王', suit:'JOKER', red:false});
  deck.push({val:17, name:'大王', suit:'JOKER', red:true});
  return deck;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function sortHand(hand){
  return hand.sort((a,b)=>a.val-b.val);
}

function initGame(){
  const deck = shuffle(createDeck());
  players[0].hand = sortHand(deck.slice(0,17));
  players[1].hand = sortHand(deck.slice(17,34));
  players[2].hand = sortHand(deck.slice(34,51));
  landlordCards = deck.slice(51,54);
  landlordIndex = -1;
  landlordScore = 0;
  currentPlayer = -1;
  lastPlay = null;
  lastPlayer = -1;
  phase = 'bidding';
  maxBid = 0;
  maxBidder = -1;
  passStreak = 0;
  bidStep = 0;
  // 随机决定第一个叫分的人，之后按座位顺序轮流循环
  const start = Math.floor(Math.random()*3);
  biddingOrder = [start,(start+1)%3,(start+2)%3];

  document.getElementById('desk').innerHTML='';
  document.getElementById('landlord-cards').innerHTML='';
  document.getElementById('last-1').innerHTML='';
  document.getElementById('last-2').innerHTML='';
  document.getElementById('bid-panel').innerHTML='';
  document.getElementById('bid-panel').style.display='none';
  document.getElementById('control-panel').style.display='none';
  document.getElementById('score-badge').style.display='none';
  document.querySelectorAll('.seat-label').forEach(el=>el.classList.remove('active'));
  resetRoleBadges();

  setInfo('发牌完毕，准备开始叫分（1~3分，最高3分封顶）…');
  render();
  setTimeout(askBidder, 700);
}

/* ============ 叫分（1~3分，轮流叫，最多封顶3分）============ */
function biddingScore(hand){
  let score = 0;
  const counts = {};
  hand.forEach(c=>{
    counts[c.val] = (counts[c.val]||0)+1;
    if(c.val===17) score += 8;
    else if(c.val===16) score += 6;
    else if(c.val===15) score += 3;
    else if(c.val>=13) score += 2;
    else score += 0.4;
  });
  Object.values(counts).forEach(c=>{ if(c===4) score += 10; });
  if(hand.some(c=>c.val===16)&&hand.some(c=>c.val===17)) score += 6;
  return score;
}

function askBidder(){
  if(phase!=='bidding') return;
  const idx = biddingOrder[bidStep % 3];
  highlightActive(idx);
  const options = [1,2,3].filter(v=>v>maxBid);

  if(players[idx].isHuman){
    setInfo(maxBidder===-1
      ? '轮到你了，自由选择叫分（1~3分），或者不叫：'
      : `当前最高 ${maxBid} 分（${players[maxBidder].name}），你可以加价或选择不叫：`);
    showBidButtons(options);
  }else{
    setInfo(`${players[idx].name} 正在考虑要不要叫分…`);
    setTimeout(()=>{
      const choice = aiDecideBid(players[idx].hand, options);
      resolveBid(idx, choice);
    }, 900);
  }
}

function showBidButtons(options){
  const panel = document.getElementById('bid-panel');
  panel.innerHTML = '';
  options.forEach(v=>{
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerText = `叫 ${v} 分`;
    btn.onclick = ()=>humanBidScore(v);
    panel.appendChild(btn);
  });
  const passBtn = document.createElement('button');
  passBtn.className = 'btn secondary';
  passBtn.innerText = '不叫';
  passBtn.onclick = ()=>humanBidScore(0);
  panel.appendChild(passBtn);
  panel.style.display = 'flex';
}

function humanBidScore(v){
  document.getElementById('bid-panel').style.display='none';
  resolveBid(0, v);
}

function aiDecideBid(hand, options){
  if(options.length===0) return 0;
  const s = biddingScore(hand);
  let desired = 0;
  if(s>30) desired=3;
  else if(s>22) desired=2;
  else if(s>16) desired=1;
  const usable = options.filter(v=>v<=desired);
  if(usable.length===0) return 0;
  return Math.max(...usable);
}

function resolveBid(idx, value){
  if(value===0){
    setInfo(`${players[idx].name} 不叫。`);
    passStreak++;
    if(maxBidder===-1 && passStreak>=3){
      setInfo('三家都不叫，重新发牌…');
      setTimeout(initGame, 1200);
      return;
    }
    if(maxBidder!==-1 && passStreak>=2){
      becomeLandlord(maxBidder, maxBid);
      return;
    }
  }else{
    maxBid = value;
    maxBidder = idx;
    passStreak = 0;
    setInfo(`${players[idx].name} 叫了 ${value} 分！`);
    if(value>=3){
      becomeLandlord(idx, value);
      return;
    }
  }
  bidStep++;
  setTimeout(askBidder, 700);
}

function becomeLandlord(idx, score){
  landlordIndex = idx;
  landlordScore = score;
  phase='playing';
  document.getElementById('bid-panel').innerHTML = '';
  document.getElementById('bid-panel').style.display='none';
  document.getElementById('control-panel').style.display='flex';
  players[idx].hand = sortHand(players[idx].hand.concat(landlordCards));
  document.querySelectorAll('.seat-label').forEach(el=>el.classList.remove('active'));
  document.getElementById(idx===0?'label-0':(idx===1?'label-1':'label-2')).classList.add('active');

  updateRoleBadges();

  const scoreBadge = document.getElementById('score-badge');
  scoreBadge.innerText = `本局叫分 × ${score}`;
  scoreBadge.style.display = 'block';

  const dc = document.getElementById('landlord-cards');
  dc.innerHTML = '';
  landlordCards.forEach(c=>dc.appendChild(makeCardEl(c,true)));

  setInfo(`${players[idx].name} 以 ${score} 分成为地主！底牌已收入手中，游戏开始。`);
  currentPlayer = idx;
  render();
  setTimeout(()=>takeTurn(), 900);
}

/* ============ 人物形象 / 地主农民角色标签 ============ */
function resetRoleBadges(){
  for(let i=0;i<3;i++){
    const avatar = document.getElementById('avatar-'+i);
    const role = document.getElementById('role-'+i);
    avatar.classList.remove('is-landlord','is-farmer');
    role.innerText = '';
    role.className = 'role-tag';
  }
}
function updateRoleBadges(){
  for(let i=0;i<3;i++){
    const avatar = document.getElementById('avatar-'+i);
    const role = document.getElementById('role-'+i);
    avatar.classList.remove('is-landlord','is-farmer');
    if(i===landlordIndex){
      avatar.classList.add('is-landlord');
      role.innerText = `地主 ×${landlordScore}`;
      role.className = 'role-tag landlord-tag';
    }else{
      avatar.classList.add('is-farmer');
      role.innerText = '农民';
      role.className = 'role-tag farmer-tag';
    }
  }
}

function highlightActive(idx){
  document.querySelectorAll('.seat-label').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById(idx===0?'label-0':(idx===1?'label-1':'label-2'));
  el.classList.add('active');
}

/* ============ 牌型识别 ============ */
function analyzePlay(cards){
  if(!cards.length) return null;
  const vals = cards.map(c=>c.val).slice().sort((a,b)=>a-b);
  const n = vals.length;
  const counts = {};
  vals.forEach(v=>counts[v]=(counts[v]||0)+1);
  const uniq = Object.keys(counts).map(Number).sort((a,b)=>a-b);

  if(n===2 && vals[0]===16 && vals[1]===17) return {type:'rocket', main:1000, len:1};
  if(n===4 && uniq.length===1) return {type:'bomb', main:vals[0], len:1};
  if(n===1) return {type:'single', main:vals[0], len:1};
  if(n===2 && uniq.length===1) return {type:'pair', main:vals[0], len:1};
  if(n===3 && uniq.length===1) return {type:'trio', main:vals[0], len:1};

  if(n===4){
    const c3 = uniq.find(v=>counts[v]===3);
    if(c3 !== undefined && uniq.length===2) return {type:'trio_single', main:c3, len:1};
    return null;
  }
  if(n===5){
    const c3 = uniq.find(v=>counts[v]===3);
    const c2 = uniq.find(v=>counts[v]===2);
    if(c3!==undefined && c2!==undefined && uniq.length===2) return {type:'trio_pair', main:c3, len:1};
  }

  if(n>=5 && uniq.length===n && vals[n-1]<=14 && vals[n-1]-vals[0]===n-1){
    return {type:'straight', main:vals[n-1], len:n};
  }

  if(n>=6 && n%2===0 && uniq.length===n/2 && uniq.every(v=>counts[v]===2)){
    const m=n/2;
    if(uniq[m-1]<=14 && uniq[m-1]-uniq[0]===m-1){
      return {type:'pair_straight', main:uniq[m-1], len:m};
    }
  }

  const exactTrio = uniq.filter(v=>counts[v]===3 && v<=14);
  for(let s=0;s<exactTrio.length;s++){
    for(let e=s+1;e<exactTrio.length;e++){
      let ok=true;
      for(let k=s;k<e;k++){ if(exactTrio[k+1]-exactTrio[k]!==1){ok=false;break;} }
      if(!ok) continue;
      const m = e-s+1;
      const used = m*3;
      const remain = n-used;
      const runSet = new Set(exactTrio.slice(s,e+1));
      if(remain===0) return {type:'airplane', main:exactTrio[e], len:m};
      if(remain===m){
        // 剩余必须都是不属于飞机主体的单张（点数不能与主体重复）
        const others = uniq.filter(v=>!runSet.has(v));
        const total = others.reduce((a,v)=>a+counts[v],0);
        if(total===remain) return {type:'airplane_single', main:exactTrio[e], len:m};
      }
      if(remain===2*m){
        const others = uniq.filter(v=>!runSet.has(v));
        const allPairs = others.every(v=>counts[v]===2);
        const total = others.reduce((a,v)=>a+counts[v],0);
        if(allPairs && total===remain) return {type:'airplane_pair', main:exactTrio[e], len:m};
      }
    }
  }
  return null;
}

function canBeat(current, last){
  if(!current) return false;
  if(!last) return true;
  if(current.type==='rocket') return true;
  if(last.type==='rocket') return false;
  if(current.type==='bomb'){
    if(last.type==='bomb') return current.main>last.main;
    return true;
  }
  if(last.type==='bomb') return false;
  if(current.type!==last.type) return false;
  if(current.len!==last.len) return false;
  return current.main>last.main;
}

/* ============ AI 出牌候选生成 ============ */
function rankGroups(hand){
  const g={};
  hand.forEach(c=>{ (g[c.val]=g[c.val]||[]).push(c); });
  return g;
}

function generateCandidates(hand){
  const groups = rankGroups(hand);
  const ranks = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  const list = [];

  ranks.forEach(r=>{
    const cnt = groups[r].length;
    if(cnt>=1) list.push({type:'single', main:r, len:1, cards:[groups[r][0]]});
    if(cnt>=2) list.push({type:'pair', main:r, len:1, cards:groups[r].slice(0,2)});
    if(cnt>=3) list.push({type:'trio', main:r, len:1, cards:groups[r].slice(0,3)});
    if(cnt===4) list.push({type:'bomb', main:r, len:1, cards:groups[r].slice(0,4)});
  });

  if(groups[16] && groups[17]) list.push({type:'rocket', main:1000, len:1, cards:[groups[16][0],groups[17][0]]});

  ranks.forEach(r=>{
    if(groups[r].length>=3){
      const wingSingle = ranks.find(x=>x!==r && groups[x].length>=1);
      if(wingSingle!==undefined) list.push({type:'trio_single', main:r, len:1, cards:[...groups[r].slice(0,3), groups[wingSingle][0]]});
      const wingPair = ranks.find(x=>x!==r && groups[x].length>=2);
      if(wingPair!==undefined) list.push({type:'trio_pair', main:r, len:1, cards:[...groups[r].slice(0,3), ...groups[wingPair].slice(0,2)]});
    }
  });

  const singleRanks = ranks.filter(r=>r<=14);
  for(let i=0;i<singleRanks.length;){
    let j=i;
    while(j+1<singleRanks.length && singleRanks[j+1]===singleRanks[j]+1) j++;
    const runLen=j-i+1;
    if(runLen>=5){
      for(let start=i; start+4<=j; start++){
        for(let L=5; start+L-1<=j; L++){
          const seq = singleRanks.slice(start,start+L);
          list.push({type:'straight', main:seq[L-1], len:L, cards:seq.map(r=>groups[r][0])});
        }
      }
    }
    i=j+1;
  }

  const pairRanks = ranks.filter(r=>r<=14 && groups[r].length>=2);
  for(let i=0;i<pairRanks.length;){
    let j=i;
    while(j+1<pairRanks.length && pairRanks[j+1]===pairRanks[j]+1) j++;
    const runLen=j-i+1;
    if(runLen>=3){
      for(let start=i; start+2<=j; start++){
        for(let L=3; start+L-1<=j; L++){
          const seq = pairRanks.slice(start,start+L);
          list.push({type:'pair_straight', main:seq[L-1], len:L, cards:seq.flatMap(r=>groups[r].slice(0,2))});
        }
      }
    }
    i=j+1;
  }

  const trioRanks = ranks.filter(r=>r<=14 && groups[r].length>=3);
  for(let i=0;i<trioRanks.length;){
    let j=i;
    while(j+1<trioRanks.length && trioRanks[j+1]===trioRanks[j]+1) j++;
    const runLen=j-i+1;
    if(runLen>=2){
      for(let start=i; start+1<=j; start++){
        for(let L=2; start+L-1<=j; L++){
          const seq = trioRanks.slice(start,start+L);
          const body = seq.flatMap(r=>groups[r].slice(0,3));
          const bodySet = new Set(seq);
          list.push({type:'airplane', main:seq[L-1], len:L, cards:body.slice()});

          const wingSingles=[];
          for(const r of ranks){
            if(bodySet.has(r)) continue;
            for(let k=0;k<groups[r].length && wingSingles.length<L;k++) wingSingles.push(groups[r][k]);
            if(wingSingles.length>=L) break;
          }
          if(wingSingles.length===L) list.push({type:'airplane_single', main:seq[L-1], len:L, cards:[...body, ...wingSingles]});

          const wingPairs=[];
          for(const r of ranks){
            if(bodySet.has(r)) continue;
            if(groups[r].length>=2 && wingPairs.length<L*2) wingPairs.push(groups[r][0], groups[r][1]);
            if(wingPairs.length>=L*2) break;
          }
          if(wingPairs.length===L*2) list.push({type:'airplane_pair', main:seq[L-1], len:L, cards:[...body, ...wingPairs]});
        }
      }
    }
    i=j+1;
  }

  return list;
}

function aiChoosePlay(hand, mustBeat){
  const candidates = generateCandidates(hand);
  if(mustBeat){
    const valid = candidates.filter(c=>canBeat(c, mustBeat));
    const nonBomb = valid.filter(c=>c.type!=='bomb'&&c.type!=='rocket');
    if(nonBomb.length){
      nonBomb.sort((a,b)=> a.main-b.main);
      return nonBomb[0];
    }
    const bombs = valid.filter(c=>c.type==='bomb'||c.type==='rocket');
    if(bombs.length){
      const useBomb = hand.length<=8 || Math.random()<0.25;
      if(useBomb){
        bombs.sort((a,b)=>(a.type==='rocket'?1:0)-(b.type==='rocket'?1:0) || a.main-b.main);
        return bombs[0];
      }
    }
    return null;
  }else{
    // 尝试一把出完
    const whole = analyzePlay(hand);
    if(whole) return {...whole, cards: hand.slice()};
    const nonBomb = candidates.filter(c=>c.type!=='bomb'&&c.type!=='rocket');
    const order = ['airplane_pair','airplane_single','airplane','pair_straight','straight','trio_pair','trio_single','trio','pair','single'];
    for(const t of order){
      const opts = nonBomb.filter(c=>c.type===t);
      if(opts.length){
        opts.sort((a,b)=> b.len-a.len || a.main-b.main);
        return opts[0];
      }
    }
    const bombs = candidates.filter(c=>c.type==='bomb'||c.type==='rocket');
    if(bombs.length) return bombs[0];
    return null;
  }
}

/* ============ 回合流程 ============ */
function takeTurn(){
  if(phase!=='playing') return;
  highlightActive(currentPlayer);
  if(players[currentPlayer].isHuman){
    const mustBeat = lastPlay && lastPlayer!==0;
    document.getElementById('btn-pass').disabled = !mustBeat;
    setInfo(mustBeat ? '轮到你了，请出牌压过上家，或选择不要。' : '轮到你了，请自由出牌。');
  }else{
    setInfo(`${players[currentPlayer].name} 思考中…`);
    setTimeout(()=>aiTurn(currentPlayer), 900);
  }
}

function aiTurn(idx){
  if(phase!=='playing') return;
  const hand = players[idx].hand;
  const mustBeat = (lastPlay && lastPlayer!==idx) ? lastPlay : null;
  const play = aiChoosePlay(hand, mustBeat);
  if(!play){
    setInfo(`${players[idx].name} 不要。`);
    clearLastVisual(idx, true);
    advanceTurn();
    return;
  }
  removeCardsFromHand(hand, play.cards);
  lastPlay = play;
  lastPlayer = idx;
  showLastPlay(idx, play.cards);
  setInfo(`${players[idx].name} 出了 ${describePlay(play)}`);
  render();
  if(hand.length===0){ endGame(idx); return; }
  advanceTurn();
}

function removeCardsFromHand(hand, cards){
  cards.forEach(c=>{
    const i = hand.indexOf(c);
    if(i>=0) hand.splice(i,1);
  });
}

function advanceTurn(){
  currentPlayer = (currentPlayer+1)%3;
  if(currentPlayer===lastPlayer){
    lastPlay = null;
    lastPlayer = -1;
    document.getElementById('desk').innerHTML='';
  }
  setTimeout(takeTurn, 500);
}

function clearLastVisual(idx, isPass){
  // 农民/地主 pass 不影响桌面显示
}

function showLastPlay(idx, cards){
  if(idx===0){
    document.getElementById('desk').innerHTML='';
    cards.forEach(c=>document.getElementById('desk').appendChild(makeCardEl(c,false)));
    document.getElementById('last-1').innerHTML='';
    document.getElementById('last-2').innerHTML='';
  }else{
    const target = document.getElementById('last-'+idx);
    target.innerHTML='';
    cards.forEach(c=>target.appendChild(makeCardEl(c,true)));
    const desk = document.getElementById('desk');
    desk.innerHTML='';
    cards.forEach(c=>desk.appendChild(makeCardEl(c,false)));
  }
}

const TYPE_NAME = {
  single:'单牌', pair:'对子', trio:'三张', trio_single:'三带一', trio_pair:'三带二',
  straight:'顺子', pair_straight:'连对', airplane:'飞机', airplane_single:'飞机带单',
  airplane_pair:'飞机带对', bomb:'炸弹', rocket:'火箭'
};
function describePlay(play){
  return `${TYPE_NAME[play.type]||play.type}（${play.cards.map(c=>c.name).join(' ')}）`;
}

/* ============ 人类操作 ============ */
function humanPlay(){
  if(phase!=='playing' || currentPlayer!==0) return;
  const selectedDivs = document.querySelectorAll('#player-cards .card.selected');
  if(selectedDivs.length===0){ alert('请先选择要出的牌！'); return; }
  const indices = Array.from(selectedDivs).map(d=>parseInt(d.dataset.index));
  const hand = players[0].hand;
  const cards = indices.map(i=>hand[i]);
  const play = analyzePlay(cards);
  if(!play){ alert('这不是有效的牌型，请重新选择。'); return; }
  play.cards = cards;
  const mustBeat = lastPlay && lastPlayer!==0;
  if(mustBeat && !canBeat(play, lastPlay)){ alert('这手牌压不过上家，请选择更大的牌或点击"不要"。'); return; }

  removeCardsFromHand(hand, cards);
  lastPlay = play;
  lastPlayer = 0;
  showLastPlay(0, cards);
  setInfo(`你出了 ${describePlay(play)}`);
  render();
  if(hand.length===0){ endGame(0); return; }
  advanceTurn();
}

function humanPass(){
  if(phase!=='playing' || currentPlayer!==0) return;
  if(!lastPlay || lastPlayer===0){ alert('现在是自由出牌，不能选择"不要"。'); return; }
  setInfo('你选择不要。');
  advanceTurn();
}

/* ============ 结束判断 ============ */
function endGame(winnerIdx){
  phase='over';
  document.getElementById('bid-panel').style.display='none';
  render();
  const landlordWon = (winnerIdx===landlordIndex);
  const msg = landlordWon
    ? `🎉 ${players[landlordIndex].name} (地主) 率先出完，地主胜利！（叫分 × ${landlordScore}）`
    : `🎉 ${players[winnerIdx].name} (农民) 率先出完，农民胜利！（叫分 × ${landlordScore}）`;
  setInfo(msg);
}

/* ============ 渲染 ============ */
function setInfo(text){
  document.getElementById('info-board').innerText = text;
}

function makeCardEl(c, small){
  const div = document.createElement('div');
  const isJoker = c.suit==='JOKER';
  div.className = (small?'desk-card':'card') + ((c.red||isJoker&&c.red)?' red':'') + (isJoker?' joker-card':'');
  const suitTxt = isJoker ? (c.val===17?'JOKER':'joker') : c.suit;
  div.innerHTML = `<span class="top">${c.name}</span><span class="suit">${suitTxt}</span>`;
  return div;
}

function render(){
  const pc = document.getElementById('player-cards');
  pc.innerHTML='';
  players[0].hand.forEach((c,idx)=>{
    const div = makeCardEl(c,false);
    div.dataset.index = idx;
    div.onclick = ()=>div.classList.toggle('selected');
    pc.appendChild(div);
  });

  [1,2].forEach(i=>{
    const el = document.getElementById('hand-'+i);
    el.innerHTML='';
    players[i].hand.forEach(()=>{
      const d = document.createElement('div');
      d.className='back-card';
      el.appendChild(d);
    });
  });

  document.getElementById('name-0').innerText = `你（剩 ${players[0].hand.length} 张）`;
  document.getElementById('name-1').innerText = `左家 AI（剩 ${players[1].hand.length} 张）`;
  document.getElementById('name-2').innerText = `右家 AI（剩 ${players[2].hand.length} 张）`;
}

function restartGame(){
  initGame();
}

initGame();
</script>
