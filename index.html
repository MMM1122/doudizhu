<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 斗地主小游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #076324; /* 经典牌桌绿 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            user-select: none;
            overflow: hidden;
        }
        #game-table {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .player-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .cards-container {
            display: flex;
            gap: -15px; /* 牌面重叠效果 */
            min-height: 110px;
            align-items: center;
            justify-content: center;
        }
        /* 扑克牌样式 */
        .card {
            width: 70px;
            height: 100px;
            background: white;
            color: black;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            position: relative;
            margin-left: -25px; /* 制造手牌层叠感 */
        }
        .card:first-child {
            margin-left: 0;
        }
        .card.selected {
            transform: translateY(-15px); /* 选中时向上弹起 */
            background-color: #f0f0f0;
            border: 2px solid #ffcc00;
        }
        .card.red {
            color: #d32f2f;
        }
        .card-top { align-self: flex-start; }
        .card-center { align-self: center; font-size: 22px; margin-top: 10px;}
        .card-bottom { align-self: flex-end; transform: rotate(180deg); }

        /* 游戏控制面板 */
        #control-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #ffcc00;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        button:hover { background: #e6b800; }
        button:active { transform: scale(0.95); }
        
        #info-board {
            text-align: center;
            font-size: 18px;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 10px;
        }
        .ai-card-back {
            width: 45px;
            height: 65px;
            background: #b71c1c;
            border: 2px solid white;
            border-radius: 4px;
            margin-left: -15px;
        }
    </style>
</head>
<body>

    <div id="game-table">
        <!-- AI 农夫 A -->
        <div class="player-area">
            <div id="ai1-name">AI 农夫 A (剩余 17 张)</div>
            <div class="cards-container" id="ai1-cards">
                <!-- 动态生成 AI 牌背 -->
            </div>
        </div>

        <!-- 中间桌面与出牌区 -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div id="info-board">游戏加载中... 准备开始洗牌发牌！</div>
            <div class="cards-container" id="table-desk" style="min-height: 100px;">
                <!-- 台面最后出的牌 -->
            </div>
            <div id="control-panel">
                <button onclick="playCards()">出牌</button>
                <button onclick="passTurn()">要不起</button>
                <button onclick="restartGame()">重新开始</button>
            </div>
        </div>

        <!-- 玩家区域 -->
        <div class="player-area">
            <div id="player-name">你的手牌 (地主争夺中)</div>
            <div class="cards-container" id="player-cards">
                <!-- 动态生成玩家手牌 -->
            </div>
        </div>
    </div>

    <script>
        // 简易前端斗地主逻辑
        const valuesMap = {3:'3', 4:'4', 5:'5', 6:'6', 7:'7', 8:'8', 9:'9', 10:'10', 11:'J', 12:'Q', 13:'K', 14:'A', 15:'2', 16:'小王', 17:'大王'};
        let deck = [], playerHand = [], ai1Hand = [], ai2Hand = [], deskCards = [];
        let turn = 0; // 0: 你, 1: AI1, 2: AI2

        function initGame() {
            deck = [];
            for(let v=3; v<=15; v++) {
                for(let i=0; i<4; i++) deck.push({val: v, name: valuesMap[v]});
            }
            deck.push({val: 16, name: 'X'});
            deck.push({val: 17, name: 'D'});
            // 洗牌
            deck.sort(() => Math.random() - 0.5);

            playerHand = deck.slice(0, 17).sort((a,b)=>a.val-b.val);
            ai1Hand = deck.slice(17, 34).sort((a,b)=>a.val-b.val);
            ai2Hand = deck.slice(34, 51).sort((a,b)=>a.val-b.val);
            
            document.getElementById("info-board").innerText = "发牌完毕！游戏开始，自由出牌！";
            render();
        }

        function render() {
            // 渲染玩家手牌
            const pContainer = document.getElementById("player-cards");
            pContainer.innerHTML = "";
            playerHand.forEach((c, idx) => {
                const div = document.createElement("div");
                div.className = `card ${c.val >= 14 ? 'red' : ''}`;
                div.innerHTML = `<span class="card-top">${c.name}</span><span class="card-center">♠</span><span class="card-bottom">${c.name}</span>`;
                div.onclick = () => div.classList.toggle("selected");
                div.dataset.index = idx;
                pContainer.appendChild(div);
            });

            // 渲染 AI1 牌背
            const ai1Container = document.getElementById("ai1-cards");
            ai1Container.innerHTML = "";
            ai1Hand.forEach(() => {
                const div = document.createElement("div");
                div.className = "ai-card-back";
                ai1Container.appendChild(div);
            });

            document.getElementById("player-name").innerText = `你的手牌 (剩 ${playerHand.length} 张)`;
            document.getElementById("ai1-name").innerText = `AI 农夫 A (剩 ${ai1Hand.length} 张)`;
        }

        function playCards() {
            const selectedDivs = document.querySelectorAll("#player-cards .card.selected");
            if(selectedDivs.length === 0) {
                alert("请先点击选择要出的牌！");
                return;
            }

            const indices = Array.from(selectedDivs).map(d => parseInt(d.dataset.index));
            const played = indices.map(i => playerHand[i]);

            // 从手中移除
            indices.sort((a,b)=>b-a).forEach(i => playerHand.splice(i, 1));
            
            deskCards = played;
            renderDesk();
            render();

            if(playerHand.length === 0) {
                document.getElementById("info-board").innerText = "🎉 恭喜你！牌出光了，你赢啦！";
                return;
            }

            document.getElementById("info-board").innerText = "你出了牌，轮到 AI 思考...";
            setTimeout(aiTurn, 1000);
        }

        function passTurn() {
            document.getElementById("info-board").innerText = "你选择要不起，轮到 AI...";
            setTimeout(aiTurn, 1000);
        }

        function renderDesk() {
            const desk = document.getElementById("table-desk");
            desk.innerHTML = "";
            deskCards.forEach(c => {
                const div = document.createElement("div");
                div.className = `card ${c.val >= 14 ? 'red' : ''}`;
                div.innerHTML = `<span class="card-top">${c.name}</span><span class="card-center">♠</span><span class="card-bottom">${c.name}</span>`;
                desk.appendChild(div);
            });
        }

        function aiTurn() {
            // 简单 AI 策略：随机出一张最小的牌
            if(ai1Hand.length > 0) {
                const card = ai1Hand.shift();
                deskCards = [card];
                renderDesk();
                document.getElementById("info-board").innerText = `AI 农夫 A 出了单牌: ${card.name}`;
            }
            render();
            if(ai1Hand.length === 0) {
                document.getElementById("info-board").innerText = "😢 游戏结束，AI 赢了！";
            }
        }

        function restartGame() {
            initGame();
        }

        // 初始化运行
        initGame();
    </script>
</body>
</html>
